<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0b1020">
<title>NEONCALC — Smart Calculator</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bangers&family=Comic+Neue:wght@400;700&display=swap" rel="stylesheet">

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

body{
  margin:0;
  min-height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  padding:18px;
  font-family:"Comic Neue",cursive;
  color:#fff;
  background:
    radial-gradient(circle at 15% 15%,#244b73 0,transparent 34%),
    radial-gradient(circle at 85% 85%,#52235f 0,transparent 34%),
    linear-gradient(135deg,#060b16,#111827 55%,#070b14);
}

body::before{
  content:"";
  position:fixed;
  inset:0;
  pointer-events:none;
  opacity:.25;
  background:
    linear-gradient(rgba(255,255,255,.035) 1px,transparent 1px),
    linear-gradient(90deg,rgba(255,255,255,.035) 1px,transparent 1px);
  background-size:32px 32px;
}

.app{
  width:100%;
  max-width:430px;
}

.brand{
  text-align:center;
  margin-bottom:14px;
}

.brand h1{
  margin:0;
  font-family:Bangers,cursive;
  font-size:54px;
  letter-spacing:5px;
  color:#fff;
  text-shadow:
    0 0 8px #55ddff,
    0 0 28px rgba(85,221,255,.65);
}

.brand p{
  margin:0;
  color:#91a5ba;
  font-size:12px;
  letter-spacing:3px;
}

.calculator{
  padding:18px;
  border-radius:28px;
  background:rgba(255,255,255,.075);
  border:1px solid rgba(255,255,255,.18);
  box-shadow:
    0 25px 70px rgba(0,0,0,.5),
    inset 0 1px rgba(255,255,255,.15);
  backdrop-filter:blur(24px);
  -webkit-backdrop-filter:blur(24px);
}

.display{
  min-height:125px;
  padding:20px 17px;
  margin-bottom:15px;
  border-radius:20px;
  background:rgba(0,0,0,.27);
  border:1px solid rgba(255,255,255,.09);
  display:flex;
  flex-direction:column;
  justify-content:flex-end;
  overflow:hidden;
}

.previous{
  min-height:24px;
  text-align:right;
  color:#7e95aa;
  font-size:15px;
  word-break:break-all;
}

.current{
  text-align:right;
  color:#fff;
  font-size:40px;
  font-weight:700;
  line-height:1.1;
  word-break:break-all;
  text-shadow:0 0 15px rgba(92,220,255,.3);
}

.keys{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:10px;
}

button{
  min-height:64px;
  border:1px solid rgba(255,255,255,.1);
  border-radius:18px;
  color:#fff;
  background:rgba(255,255,255,.075);
  font-family:"Comic Neue",cursive;
  font-size:21px;
  font-weight:700;
  cursor:pointer;
  box-shadow:
    inset 0 1px rgba(255,255,255,.08),
    0 5px 15px rgba(0,0,0,.16);
  transition:.12s ease;
}

button:hover{
  background:rgba(255,255,255,.13);
}

button:active{
  transform:scale(.94);
}

.action{
  color:#72dcff;
}

.operator{
  color:#c39cff;
  background:rgba(139,108,255,.12);
}

.equals{
  color:#07111f;
  background:linear-gradient(135deg,#57d9ff,#9b70ff);
  box-shadow:0 8px 25px rgba(87,217,255,.2);
}

.zero{
  grid-column:span 2;
}

.history{
  margin-top:15px;
}

.history-title{
  color:#8195aa;
  font-size:12px;
  letter-spacing:2px;
  margin-bottom:7px;
}

.history-list{
  max-height:110px;
  overflow:auto;
}

.history-item{
  padding:7px 10px;
  margin-bottom:5px;
  border-radius:10px;
  background:rgba(255,255,255,.045);
  color:#b9c8d6;
  font-size:13px;
  text-align:right;
}

.footer{
  text-align:center;
  color:#617386;
  font-size:10px;
  margin-top:13px;
  letter-spacing:1px;
}

@media(max-width:390px){
  button{
    min-height:58px;
  }

  .current{
    font-size:34px;
  }

  .brand h1{
    font-size:46px;
  }
}
</style>
</head>

<body>

<div class="app">

  <div class="brand">
    <h1>NEONCALC</h1>
    <p>SMART GLASS CALCULATOR</p>
  </div>

  <div class="calculator">

    <div class="display">
      <div class="previous" id="previous"></div>
      <div class="current" id="current">0</div>
    </div>

    <div class="keys">

      <button class="action" onclick="clearAll()">AC</button>
      <button class="action" onclick="deleteLast()">⌫</button>
      <button class="action" onclick="percent()">%</button>
      <button class="operator" onclick="chooseOperator('÷')">÷</button>

      <button onclick="number('7')">7</button>
      <button onclick="number('8')">8</button>
      <button onclick="number('9')">9</button>
      <button class="operator" onclick="chooseOperator('×')">×</button>

      <button onclick="number('4')">4</button>
      <button onclick="number('5')">5</button>
      <button onclick="number('6')">6</button>
      <button class="operator" onclick="chooseOperator('−')">−</button>

      <button onclick="number('1')">1</button>
      <button onclick="number('2')">2</button>
      <button onclick="number('3')">3</button>
      <button class="operator" onclick="chooseOperator('+')">+</button>

      <button class="zero" onclick="number('0')">0</button>
      <button onclick="decimal()">.</button>
      <button class="equals" onclick="calculate()">=</button>

    </div>

    <div class="history">
      <div class="history-title">CALCULATION HISTORY</div>
      <div class="history-list" id="historyList"></div>
    </div>

  </div>

  <div class="footer">
    NEONCALC • V1.0 • OFFLINE CALCULATOR
  </div>

</div>

<script>
let current = "0";
let previous = "";
let operator = null;
let resetNext = false;

const currentEl = document.getElementById("current");
const previousEl = document.getElementById("previous");
const historyList = document.getElementById("historyList");

function updateDisplay(){
  currentEl.textContent = current;
  previousEl.textContent =
    previous && operator
      ? previous + " " + operator
      : "";
}

function number(value){
  if(resetNext){
    current = value;
    resetNext = false;
  }else{
    current = current === "0" ? value : current + value;
  }

  if(current.length > 15){
    current = current.slice(0,15);
  }

  updateDisplay();
}

function decimal(){
  if(resetNext){
    current = "0.";
    resetNext = false;
  }else if(!current.includes(".")){
    current += ".";
  }

  updateDisplay();
}

function clearAll(){
  current = "0";
  previous = "";
  operator = null;
  resetNext = false;
  updateDisplay();
}

function deleteLast(){
  if(resetNext) return;

  current =
    current.length > 1
      ? current.slice(0,-1)
      : "0";

  updateDisplay();
}

function chooseOperator(op){
  if(operator && !resetNext){
    calculate(false);
  }

  previous = current;
  operator = op;
  resetNext = true;
  updateDisplay();
}

function calculate(addHistory=true){
  if(!operator || previous === "") return;

  const a = parseFloat(previous);
  const b = parseFloat(current);

  let result;

  if(operator === "+") result = a + b;
  if(operator === "−") result = a - b;
  if(operator === "×") result = a * b;

  if(operator === "÷"){
    if(b === 0){
      current = "Error";
      previous = "";
      operator = null;
      resetNext = true;
      updateDisplay();
      return;
    }

    result = a / b;
  }

  if(!Number.isFinite(result)){
    current = "Error";
  }else{
    result = Math.round((result + Number.EPSILON) * 100000000) / 100000000;
    current = String(result);
  }

  if(addHistory && current !== "Error"){
    addHistoryItem(
      `${a} ${operator} ${b} = ${current}`
    );
  }

  previous = "";
  operator = null;
  resetNext = true;
  updateDisplay();
}

function percent(){
  const value = parseFloat(current);

  if(!Number.isNaN(value)){
    current = String(value / 100);
    updateDisplay();
  }
}

function addHistoryItem(text){
  const item = document.createElement("div");
  item.className = "history-item";
  item.textContent = text;

  historyList.prepend(item);

  while(historyList.children.length > 8){
    historyList.removeChild(historyList.lastChild);
  }
}

document.addEventListener("keydown",(e)=>{

  if(/^[0-9]$/.test(e.key)){
    number(e.key);
    return;
  }

  if(e.key === "."){
    decimal();
    return;
  }

  if(e.key === "+"){
    chooseOperator("+");
    return;
  }

  if(e.key === "-"){
    chooseOperator("−");
    return;
  }

  if(e.key === "*"){
    chooseOperator("×");
    return;
  }

  if(e.key === "/"){
    e.preventDefault();
    chooseOperator("÷");
    return;
  }

  if(e.key === "%"){
    percent();
    return;
  }

  if(e.key === "Enter" || e.key === "="){
    calculate();
    return;
  }

  if(e.key === "Backspace"){
    deleteLast();
    return;
  }

  if(e.key === "Escape"){
    clearAll();
  }

});

updateDisplay();
</script>

</body>
</html>
